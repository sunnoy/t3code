name: Fork desktop build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable T3C Code version to publish (X.Y.Z)
        required: true
        type: string

concurrency:
  group: t3c-release-${{ inputs.version }}

permissions:
  contents: read

env:
  T3CODE_DESKTOP_UPDATE_REPOSITORY: sunnoy/t3code
  T3CODE_TELEMETRY_CHANNEL: dev
  INSTALL_ARGS: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

jobs:
  bundle:
    name: JS bundle
    if: github.repository == 'sunnoy/t3code' && startsWith(github.ref_name, 'fork/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.INSTALL_ARGS }}
      - name: Stamp fork release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build release bundles
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: vp run build:desktop:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

  linux-cli:
    name: Linux CLI archive
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.INSTALL_ARGS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }
      - name: Build resource monitor
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
      - run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client
      - name: Build the versioned server executable
        env:
          # The executable repacks the CLI from source on this runner.
          APP_VERSION: ${{ needs.bundle.outputs.version }}
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - run: |
          node scripts/build-cli-archive.ts --platform linux --arch x64 \
            --version "${{ needs.bundle.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
      - run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.bundle.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

  mac:
    name: macOS installer (x64)
    needs: bundle
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.INSTALL_ARGS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-apple-darwin
      - name: Build desktop artifact
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: |
          vp run dist:desktop:artifact --platform mac --target dmg --arch x64 \
            --build-version "${{ needs.bundle.outputs.version }}" --skip-build --verbose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-x64
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  win:
    name: Windows installer (x64)
    needs: [bundle, linux-cli]
    # Upstream cross-builds Windows on Linux too; the installer bundles the Linux CLI for WSL.
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.INSTALL_ARGS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: wsl-runtime
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1
      - run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build desktop artifact
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: |
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 \
            --build-version "${{ needs.bundle.outputs.version }}" --skip-build --verbose \
            --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-win-x64
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

  publish:
    name: Publish the three x64 builds
    needs: [bundle, linux-cli, mac, win]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.bundle.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-mac-x64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: release
      - name: Verify package and feed metadata
        working-directory: release
        run: |
          desktop="T3C-Code-$RELEASE_VERSION-x64"
          cli="t3-$RELEASE_VERSION-linux-x64.tar.gz"
          for file in "$desktop.dmg" "$desktop.zip" "$desktop.exe" "$cli" latest-mac.yml latest.yml; do
            test -s "$file"
          done
          for pair in "latest-mac.yml:zip" "latest.yml:exe"; do
            manifest="${pair%:*}"
            package="$desktop.${pair#*:}"
            hash="$(openssl dgst -sha512 -binary "$package" | base64 -w 0)"
            grep -Fx "version: $RELEASE_VERSION" "$manifest"
            grep -F "url: $package" "$manifest"
            grep -F "sha512: $hash" "$manifest"
          done
          sha256sum "$desktop.dmg" "$desktop.zip" "$desktop.exe" "$cli" > SHA256SUMS
      - name: Publish GitHub Release
        working-directory: release
        run: |
          cat > "$RUNNER_TEMP/t3c-release-notes.md" <<'NOTES'
          T3C Code is an unofficial, independently maintained fork of T3 Code. The C stands for Clean. T3 Tools, Inc. does not endorse this release.

          - **macOS Intel x64** — Download the DMG.
          - **Windows x64** — Download the EXE installer.
          - **Linux Server x64** — Download the tar.gz archive.

          The desktop apps check this repository for updates and open the release page for manual installation. The installers ship without Apple Developer ID or Microsoft Authenticode signatures. The ZIP and YAML files support update discovery.
          NOTES
          gh release create "v$RELEASE_VERSION" ./* --draft --target "$GITHUB_SHA" \
            --title "T3C Code $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/t3c-release-notes.md"
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
