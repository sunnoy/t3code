name: T3C Code Server release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable T3C Code version to publish (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ matrix.label }}
    if: github.repository == 'sunnoy/t3code' && startsWith(github.ref_name, 'fork/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux Server x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            platform_key: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            sea: true
          - label: macOS Server arm64
            runner: macos-latest
            platform: mac
            arch: arm64
            platform_key: darwin-arm64
            rust_target: aarch64-apple-darwin
            sea: true
          - label: macOS Server x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            platform_key: darwin-x64
            rust_target: x86_64-apple-darwin
            sea: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set the release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - name: Install patchelf
        if: matrix.platform == 'linux'
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }
      - name: Build the server and its embedded web client
        run: |
          vp run --filter t3 build
          node scripts/apply-web-brand-assets.ts production apps/server/dist/client
          grep -Fq '<title>T3C Code' apps/server/dist/client/index.html
      - name: Build single-executable
        if: matrix.sea
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - name: Build the resource monitor
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/${{ matrix.platform_key }}"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" \
            "$RUNNER_TEMP/cli-resource-monitor/${{ matrix.platform_key }}/"
      - name: Create the archive and smoke-test its server
        run: |
          node scripts/build-cli-archive.ts --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" \
            --version "$APP_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release
          archive="t3-$APP_VERSION-${{ matrix.platform_key }}.tar.gz"
          node scripts/smoke-cli-archive.ts --archive "release/$archive" --expect-version "$APP_VERSION"
          tar -xOf "release/$archive" "t3-$APP_VERSION-${{ matrix.platform_key }}/LICENSE" | cmp - LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.platform_key }}
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Server archives
    needs: build
    concurrency:
      group: t3c-release-${{ needs.build.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Only the installer: CLI_INSTALL_SCRIPT_URL serves it from the latest release.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          merge-multiple: true
          path: release
      - name: Stage the installer
        run: install -m 0755 scripts/install.sh release/install.sh
      - name: Verify and publish
        working-directory: release
        run: |
          archives=(
            "t3-$RELEASE_VERSION-darwin-arm64.tar.gz"
            "t3-$RELEASE_VERSION-darwin-x64.tar.gz"
            "t3-$RELEASE_VERSION-linux-x64.tar.gz"
          )
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat > "$RUNNER_TEMP/t3c-release-notes.md" <<'NOTES'
          T3C Code is an unofficial, independently maintained fork of T3 Code. The C stands for Clean. Each archive includes the web app and the upstream MIT license.

          ### Archives
          - **Linux x64** (`linux-x64`): Node single-executable server.
          - **macOS Apple Silicon** (`darwin-arm64`): Node single-executable server (ad-hoc signed).
          - **macOS Intel** (`darwin-x64`): Self-contained bundled Node server (ad-hoc signed; Node SEA is unsupported on Intel macOS).

          ### Quick start
          Extract the archive for your platform. On macOS, if downloaded through a browser, clear quarantine first: `xattr -dr com.apple.quarantine ./t3-*-darwin-*`.

          - Install or update with the script (macOS, Linux): `curl -fsSL https://github.com/sunnoy/t3code/releases/latest/download/install.sh | sh`, then `~/.local/bin/t3 up` for the background service.
          - Run in foreground: `./t3 serve` (or `./t3 serve --lan` for LAN access).
          - Run as a background service that keeps running when the desktop client closes: `./t3 service install` (uses `systemd` on Linux and `launchd` on macOS).
          - Connect the official Mac app: disable **Local environment** in Settings, run `./t3 pair` on the server, and paste the pairing URL into **Add environment**.

          `SHA256SUMS` verifies all archives. T3C Code Server uses this repository for CLI updates.
          NOTES
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/v$RELEASE_VERSION" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release upload "v$RELEASE_VERSION" "${archives[@]}" SHA256SUMS install.sh --clobber
            gh release edit "v$RELEASE_VERSION" \
              --title "T3C Code Server $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/t3c-release-notes.md" \
              --draft=false --latest
          else
            gh release create "v$RELEASE_VERSION" "${archives[@]}" SHA256SUMS install.sh --draft --target "$GITHUB_SHA" \
              --title "T3C Code Server $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/t3c-release-notes.md"
            gh release edit "v$RELEASE_VERSION" --draft=false --latest
          fi
